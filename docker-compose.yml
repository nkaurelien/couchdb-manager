version: '3.8'

services:
  couchdb-manager:
    build: .
    container_name: couchdb-manager
    ports:
      - "127.0.0.1:8501:8501"   # no built-in authentication: keep it local or behind an authenticating proxy
    volumes:
      - ./backups:/app/backups
      - ./.env:/app/.env:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    networks:
      - couchdb-network

networks:
  couchdb-network:
    driver: bridge

volumes:
  backups: